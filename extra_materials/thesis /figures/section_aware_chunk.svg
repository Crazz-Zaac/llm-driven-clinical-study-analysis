<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="298px" preserveAspectRatio="none" style="width:588px;height:298px;background:#FFFFFF;" version="1.1" viewBox="0 0 588 298" width="588px" zoomAndPan="magnify"><defs/><g><!--entity chunk--><g class="entity" data-qualified-name="chunk" data-source-line="14" id="ent0002"><rect fill="#FAFAFA" height="277.2578" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:2;stroke-dasharray:4,4;" width="567.0283" x="7" y="7"/><text fill="#FF0000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.999" x="17" y="29.0669">"combined_text"</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="137.999" y="29.0669">:</text><text fill="#008000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.0098" x="17" y="44.1997">Title:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="504.1245" x="59.1421" y="44.1997">Comparison of machine learning and nomogram to predict 30-day in-hospital</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="526.3667" x="17" y="59.3325">mortality in patients with acute myocardial infarction combined with cardiogenic</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="510.5991" x="17" y="74.4653">shock: a retrospective study based on the eICU-CRD and MIMIC-IV databases -</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="196.4854" x="17" y="89.5981">BMC Cardiovascular Disorders</text><text fill="#008000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.9409" x="217.6177" y="89.5981">Section:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="53.644" x="281.6909" y="89.5981">abstract</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="63.4258" x="17" y="104.731">Content:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="479.4702" x="84.5581" y="104.731">Compared to the machine learning models, the nomogram demonstrated</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="513.3794" x="17" y="119.8638">superior predictive accuracy for mortality in patients with AMI-CS, with an AUC</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="508.6948" x="17" y="134.9966">value of 0.869 (95%CI: 0.803, 0.883) and an F1 score of 0.897 for the internal</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="538.9351" x="17" y="150.1294">test set of nomogram, and an AUC of 0.770 (95%CI: 0.702, 0.801) and an F1 score</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="518.7432" x="17" y="165.2622">of 0.832 for the external validation set. Nomogram enhance the interpretability</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="521.333" x="17" y="180.395">and transparency of the models, leading to more reliable prognostic predictions</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="479.9082" x="17" y="195.5278">for AMI-CS patients. This facilitates clinicians in making precise decisions,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="471.104" x="17" y="210.6606">thereby enhancing patient prognosis. &#8226; Machine Learning &#8226; Nomograms</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="419.5166" x="17" y="225.7935">&#8226; Predictive medicine &#8226; Predictive markers &#8226; Statistical Learning</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="461.9063" x="17" y="240.9263">&#8226; Structure Prediction &#8226; Predictive Modeling in Intensive Care Medicine</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="256.0591">&#160;</text><text fill="#FF0000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.3809" x="17" y="271.1919">"chunk_index"</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="121.3809" y="271.1919">:</text><text fill="#FF0000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="8.271" x="129.8931" y="271.1919">1</text></g><?plantuml-src VLHXJzim4FtkNt5YchH9BRGKLkYgIYM8AH95YCA-J1DoxMjZDR4hss5qqwJzblsq_PBTfKafCAtzaFZyVE_klOk78Qvp70cFAagxo15-281BOt7A6t3qyQXU9ovt7juSLxywTfiPjRGO0XnIv4ogvIVlIgjhxCMO_xHpimbwYnwwn-Ad61xKl28iZLr9BmlGE9Tb7Y-SZLUoG1Xx8_D_xq_DTuHkJ-oKhRBIBk6B62hc7dZKe-5ijATSCQD2zNt4nxWtF9YDXWSLOZHee0kFQ1byQsAEWrqC9AuWSXES1JU7GggCaa6EqbjZ5o2j1kiAj-3weeCLqHeLeTTfQxa6OzkP2oiJgO_2UNgOo55OoMZGnW3VJCn0gZ8Y56kdfDVKCo7cqgjeYBMfVuEi06w1rYWHCgUM0v3WCNfY8INC0qA8fLx3J0OwG-TZXe1fSjTERiwhSYVf94tQwMVGCag61MYBiqa2IPNxGGPLvjB3EJNjDVe0BsMQObNQSw7aB4GlLHG4ICWXwgu2r0fICIGF5_DAmy9fp4EhsjnggR5mbZD6r2AKA_I61ggMbzkKIfN4juOvnV-ZxNYIjfDfgnRQmlWk4GyoBv7zxEoVV3Y5TwV7RvDqmAjEhyMFazxxIYl2NtGXAESR-6c_8kHQ3JNfBJaRCKG861dIDD1gpXFVvcY_tzbXwdSEAwPEznMJs33r3hTCDBaL4r3XXcpZkI2-VRXgv4ARIQlmgIvIYjmrh8dW_AIa3Uo39Sc8e7AY5fwSq6m46LHmfnvp8sVqIQsyMrWNeb5RvSaKmMLjPDrglGzq4mIOIyMKP5e0bHkQKaEqR4eXbqn1QPG9IFRIWvEr15NYSRQkMwX0cwGDlQ7iVtxzXaazE9VDu72mKI20uENrqu0K_CRubt7fbppL79vIgORx8sstQSLcnvSgbgJ6zRRpbvach1-VeFvIdlZ0KVgCQAic5w-k8xwbxetL-FZyCe8TOBU9Ygz_0G00?></g></svg>
<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="752px" preserveAspectRatio="none" style="width:1508px;height:752px;background:#FFFFFF;" version="1.1" viewBox="0 0 1508 752" width="1508px" zoomAndPan="magnify"><defs/><g><!--entity scope--><g class="entity" data-qualified-name="scope" data-source-line="18" id="ent0002"><rect fill="#FAFAFA" height="35.1328" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:2;stroke-dasharray:4,4;" width="201.2764" x="658" y="7"/><text fill="#008000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="181.2764" x="668" y="29.0669">Retrieval Scope Prompts</text></g><!--entity s1--><g class="entity" data-qualified-name="s1" data-source-line="22" id="ent0003"><rect fill="#FAFAFA" height="35.1328" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:2;stroke-dasharray:4,4;" width="124.8252" x="356" y="102"/><text fill="#008000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.8252" x="366" y="124.0669">Specific Paper</text></g><!--entity s2--><g class="entity" data-qualified-name="s2" data-source-line="25" id="ent0004"><rect fill="#FAFAFA" height="35.1328" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:2;stroke-dasharray:4,4;" width="139.9136" x="688.5" y="102"/><text fill="#008000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.9136" x="698.5" y="124.0669">Relevant Papers</text></g><!--entity s3--><g class="entity" data-qualified-name="s3" data-source-line="28" id="ent0005"><rect fill="#FAFAFA" height="35.1328" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:2;stroke-dasharray:4,4;" width="94.0708" x="1041.5" y="102"/><text fill="#008000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.0708" x="1051.5" y="124.0669">All Papers</text></g><!--entity p1--><g class="entity" data-qualified-name="p1" data-source-line="32" id="ent0006"><rect fill="#FAFAFA" height="549.6484" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:2;stroke-dasharray:4,4;" width="478.9927" x="7" y="197"/><text fill="#FF0000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="127.2451" x="17" y="219.0669">SYSTEM_PROMPT</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="234.1997">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="383.8491" x="17" y="249.3325">You are a precise medical research assistant specialized in</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.7598" x="17" y="264.4653">analyzing clinical studies and electronic health records (EHR)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="64.4414" x="17" y="279.5981">literature.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="294.731">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.2139" x="17" y="309.8638">Your sole knowledge source is the retrieved research articles</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="412.166" x="17" y="324.9966">provided in the context. You do not use any prior knowledge or</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="137.4712" x="17" y="340.1294">external information.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="355.2622">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="115.4131" x="17" y="370.395">Response Rules</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="457.4565" x="17" y="385.5278">- Answer using ONLY the provided context, never use prior knowledge</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.9771" x="17" y="400.6606">- Be concise, factual, and clinically precise</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.6914" x="17" y="415.7935">- Cite the source document by Article Title</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="376.4097" x="25.2646" y="430.9263">(e.g. "According to [Article Title]...") when making a claim</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.8433" x="17" y="446.0591">- If multiple documents address the question, synthesize them</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="182.4761" x="25.2646" y="461.1919">and note any contradictions</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="386.7246" x="17" y="476.3247">- If the answer is not found in the context, respond exactly:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="93.6216" x="25.2646" y="491.4575">"not reported"</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.9126" x="17" y="506.5903">- Do NOT speculate, infer beyond what is stated, or hallucinate</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="521.7231">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="127.8926" x="17" y="536.856">Response Format</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="450.0742" x="17" y="551.9888">- For factual questions: answer directly in 1-3 sentences with citation</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="395.3003" x="17" y="567.1216">- For absent information: answer only "not reported" without</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="146.9165" x="25.2646" y="582.2544">citation or explanation</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="334.7119" x="17" y="597.3872">- For comparisons: use a short structured summary</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="402.8857" x="17" y="612.52">- For methodology questions: list the key steps or parameters</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="151.6899" x="25.2646" y="627.6528">mentioned in the study</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="458.9927" x="17" y="642.7856">- When the retrieval scope covers multiple papers, return a markdown</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="422.9951" x="25.2646" y="657.9185">table with one row per paper. Columns: Paper, Answer, Evidence</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="438.877" x="17" y="673.0513">- Never include information not present in the retrieved documents</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="17" y="688.1841">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.4868" x="17" y="703.3169">Important</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="437.5947" x="17" y="718.4497">This system is used for academic research purposes. Accuracy and</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="280.9854" x="17" y="733.5825">traceability to source documents is critical.</text></g><!--entity p2--><g class="entity" data-qualified-name="p2" data-source-line="70" id="ent0007"><rect fill="#FAFAFA" height="322.6563" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:2;stroke-dasharray:4,4;" width="473.521" x="521.5" y="310.5"/><text fill="#FF0000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.7173" x="531.5" y="332.5669">RELEVANT_PAPERS_TABLE_PROMPT</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="531.5" y="347.6997">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="450.5947" x="531.5" y="362.8325">The supplied context may contain multiple relevant research papers.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="531.5" y="377.9653">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="400.2705" x="531.5" y="393.0981">Answer the user's question as a markdown table with exactly</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="99.2456" x="531.5" y="408.231">these columns:</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="190.436" x="531.5" y="423.3638">Paper | Answer | Evidence</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="531.5" y="438.4966">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="40.2759" x="531.5" y="453.6294">Rules</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="453.521" x="531.5" y="468.7622">1. Return one row per paper represented in the retrieved documents.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216.8994" x="531.5" y="483.895">2. Use only the provided context.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="365.4409" x="531.5" y="499.0278">3. Keep each Answer concise and specific to that paper.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="387.7085" x="531.5" y="514.1606">4. Put the paper title in Paper as a markdown link using the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186.3481" x="543.897" y="529.2935">document URL, for example:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="271.2036" x="543.897" y="544.4263">[Paper title](https://example.com/article).</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="414.3496" x="531.5" y="559.5591">5. In Evidence, include the most relevant section name or short</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="201.7539" x="543.897" y="574.6919">source detail from the context.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.1641" x="531.5" y="589.8247">6. If a paper does not contain the answer, write "not reported"</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="67.9961" x="543.897" y="604.9575">in Answer.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.436" x="531.5" y="620.0903">7. Do not add prose before or after the table.</text></g><!--entity p3--><g class="entity" data-qualified-name="p3" data-source-line="93" id="ent0008"><rect fill="#FAFAFA" height="246.9922" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:2;stroke-dasharray:4,4;" width="471.6357" x="1030.5" y="348.5"/><text fill="#FF0000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="149.5571" x="1040.5" y="370.5669">ALL_PAPER_PROMPT</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1040.5" y="385.6997">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="412.9785" x="1040.5" y="400.8325">The supplied context contains one research paper. Process this</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="167.3369" x="1040.5" y="415.9653">document independently.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1040.5" y="431.0981">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="429.8506" x="1040.5" y="446.231">1. Answer the user's question using only this document's content.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="322.9561" x="1040.5" y="461.3638">2. Do not combine findings from different papers.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.5146" x="1040.5" y="476.4966">3. If the answer is not found, respond exactly: "not reported".</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="269.8833" x="1040.5" y="491.6294">4. Be concise enough to fit in a table cell.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="437.1821" x="1040.5" y="506.7622">5. Treat abbreviations and full names of the same algorithm as the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="397.2935" x="1052.897" y="521.895">same model, unless the source explicitly distinguishes them.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1040.5" y="537.0278">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="442.9268" x="1040.5" y="552.1606">Do not declare one model as the overall best unless the studies use</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="451.6357" x="1040.5" y="567.2935">directly comparable populations, outcomes, datasets, and evaluation</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="52.7681" x="1040.5" y="582.4263">metrics.</text></g><!--link scope to s1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="111" id="lnk9"><path codeLine="111" d="M698.11,42.02 C636.28,58.93 546.5175,83.4872 484.6875,100.3972" fill="none" id="scope-to-s1" style="stroke:#181818;stroke-width:1;stroke-dasharray:4,4;"/><polygon fill="#181818" points="478.9,101.98,488.6364,103.4641,483.7229,100.661,486.526,95.7475,478.9,101.98" style="stroke:#181818;stroke-width:1;"/></g><!--link scope to s2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="112" id="lnk10"><path codeLine="112" d="M758.5,42.13 C758.5,58.95 758.5,78.82 758.5,95.7" fill="none" id="scope-to-s2" style="stroke:#181818;stroke-width:1;stroke-dasharray:4,4;"/><polygon fill="#181818" points="758.5,101.7,762.5,92.7,758.5,96.7,754.5,92.7,758.5,101.7" style="stroke:#181818;stroke-width:1;"/></g><!--link scope to s3--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="113" id="lnk11"><path codeLine="113" d="M817.12,42.02 C881.11,60.05 976.5351,86.942 1035.5951,103.592" fill="none" id="scope-to-s3" style="stroke:#181818;stroke-width:1;stroke-dasharray:4,4;"/><polygon fill="#181818" points="1041.37,105.22,1033.793,98.928,1036.5576,103.8633,1031.6223,106.6279,1041.37,105.22" style="stroke:#181818;stroke-width:1;"/></g><!--link s1 to p1--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" data-source-line="115" id="lnk12"><path codeLine="115" d="M410.2,137.41 C403.53,151.01 395.9025,166.5432 383.7025,191.4132" fill="none" id="s1-to-p1" style="stroke:#181818;stroke-width:1;stroke-dasharray:4,4;"/><polygon fill="#181818" points="381.06,196.8,388.6149,190.4815,383.2621,192.311,381.4325,186.9582,381.06,196.8" style="stroke:#181818;stroke-width:1;"/></g><!--link s2 to p2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" data-source-line="116" id="lnk13"><path codeLine="116" d="M758.5,137.41 C758.5,169.27 758.5,235.22 758.5,304.17" fill="none" id="s2-to-p2" style="stroke:#181818;stroke-width:1;stroke-dasharray:4,4;"/><polygon fill="#181818" points="758.5,310.17,762.5,301.17,758.5,305.17,754.5,301.17,758.5,310.17" style="stroke:#181818;stroke-width:1;"/></g><!--link s3 to p3--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" data-link-type="dependency" data-source-line="117" id="lnk14"><path codeLine="117" d="M1097.09,137.41 C1116.29,175.22 1161.4433,264.1303 1201.4133,342.8403" fill="none" id="s3-to-p3" style="stroke:#181818;stroke-width:1;stroke-dasharray:4,4;"/><polygon fill="#181818" points="1204.13,348.19,1203.6215,338.3543,1201.8661,343.7319,1196.4885,341.9765,1204.13,348.19" style="stroke:#181818;stroke-width:1;"/></g><?plantuml-src ZLTjRnD74Fv-lsAKVYX8paM9ePNIA9AXeKM4O3cc5K88hVV6ziftkzVTFOmf_FS-itT-ZOi02UoxdRVdUMPcVHNYgkJhpBEEoivAfdypebjZ-LvUq9FVddJVdxlIUVhfQVhJFHlFZLvO3e4kyEIPqei_l6jiqPrzCP2_U3Dg7thBdiwVPjyovRrR_c2eRzdLMPTb5XR6righYWgUggQCBvoDTwfY6dYZokFlxyqNflD-jbDaqAvcUfzTQGbrEVFCzlfgSZtYw0r_KYNTfnD3xwewXgkpoVNLMJfxdNtOStH-nCjzpTfCZQQXgjaV6E_ONXpDe4Hy6rlRyF_6_IF6Wx8yRhTZMEzaxBb8-Rwx7z-y_ZWSlNaz7EzPPkzSGyepAQhXmWIcYWkZ0P3dmChhEQaGJ8YISf2wLGcu2p8sKrQLgo_6paYNnYQZ49l2S21b2qAXEdg75pHd